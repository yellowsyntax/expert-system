<!DOCTYPE html>
<html>
<head>
    <title>Batch Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 5px;
        }
        .status {
            padding: 5px 10px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        
        button {
            padding: 8px 15px;
            margin: 5px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }
        button:hover { background: #f0f0f0; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th { background: #f5f5f5; }
        
        .progress {
            width: 100px;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #007bff;
            transition: width 0.3s;
        }
        
        .log {
            background: #000;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            height: 150px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Batch Processing Monitor</h2>
        
        <div class="status disconnected" id="status">Disconnected</div>
        
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        
        <table>
            <thead>
                <tr>
                    <th>Batch ID</th>
                    <th>Provider Name</th>
                    <th>Processing Status</th>
                    <th>Progress</th>
                    <th>Total Claims</th>
                    <th>Processed</th>
                    <th>Flagged</th>
                    <th>Rejected</th>
                </tr>
            </thead>
            <tbody id="batches">
                <tr><td colspan="8">testin testing testing testing chale</td></tr>
            </tbody>
        </table>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        let ws = null;
        let logs = [];

        function connect() {
            if (ws) return;
            
            ws = new WebSocket('ws://13.217.48.101:8000/v2/batch-monitor/ws/all-batches');
            
            ws.onopen = () => {
                updateStatus('Connected', 'connected');
                log('Connected to server');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'all_batches_status' || data.type === 'all_batches_update') {
                    updateBatches(data.data);
                    log('Batch data received');
                }
            };
            
            ws.onclose = () => {
                updateStatus('Disconnected', 'disconnected');
                log('Connection closed');
                ws = null;
            };
            
            ws.onerror = () => {
                log('Connection error');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function updateStatus(text, className) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status ' + className;
        }

        function updateBatches(batches) {
            const tbody = document.getElementById('batches');
            
            if (batches.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8">No active batches</td></tr>';
                return;
            }
            
            tbody.innerHTML = batches.map(batch => `
                <tr>
                    <td>${batch.batch_id}</td>
                    <td>${batch.provider_name || 'Unknown'}</td>
                    <td>${batch.processing_status || batch.status}</td>
                    <td>
                        <div class="progress">
                            <div class="progress-bar" style="width: ${batch.percentage_complete}%"></div>
                        </div>
                        ${batch.percentage_complete.toFixed(1)}%
                    </td>
                    <td>${batch.total_claims}</td>
                    <td>${batch.processed_claims}</td>
                    <td>${batch.flagged_claims}</td>
                    <td>${batch.rejected_claims}</td>
                </tr>
            `).join('');
        }

        function log(message) {
            const time = new Date().toLocaleTimeString();
            logs.unshift(`[${time}] ${message}`);
            if (logs.length > 20) logs.pop();
            
            document.getElementById('log').innerHTML = logs.join('<br>');
        }
    </script>
</body>
</html>
